# ansible/inventories/prod.ini
# Static inventory — replace IPs with actual EC2 private IPs from Terraform output
# OR use the dynamic inventory script: scripts/gen_inventory.sh

[app_servers]
# Add your EC2 private IPs here after terraform apply:
# 10.0.11.xxx ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/id_rsa
# 10.0.12.xxx ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/id_rsa

[app_servers:vars]
ansible_user               = ec2-user
ansible_ssh_private_key_file = ~/.ssh/id_rsa
ansible_ssh_common_args    = -o StrictHostKeyChecking=no
ansible_python_interpreter = /usr/bin/python3

# App config (passed to roles)
app_port    = 8080
project     = iac-demo
environment = prod
aws_region  = ap-south-1

# DB config — fill from terraform output
# db_host     = <rds_endpoint from terraform output>
# db_name     = appdb
# db_username = dbadmin
# db_password = <your password>
